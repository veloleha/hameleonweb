version: '3.8'

services:
  # Shared SQLite storage
  sqlite-init:
    image: alpine:3.20
    command: sh -c "mkdir -p /data && touch /data/hameleonweb.db && echo 'SQLite ready'"
    volumes:
      - ./data:/data
    restart: "no"

  # FastAPI License Server
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - DB_PATH=/data/hameleonweb.db
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_change_me}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      - NOWPAYMENTS_API_KEY=${NOWPAYMENTS_API_KEY}
      - NOWPAYMENTS_IPN_SECRET=${NOWPAYMENTS_IPN_SECRET}
      - MIN_PAYMENT_USD=${MIN_PAYMENT_USD:-11}
      - TRIAL_DAYS=${TRIAL_DAYS:-7}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # WebRTC Sufler Signaling Server
  sufler:
    build:
      context: ./sufler
      dockerfile: Dockerfile
    environment:
      - SUFLER_PORT=8001
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./sufler/static:/app/static:ro
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  # Python Telegram Bot
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      - DB_PATH=/data/hameleonweb.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
      - NOWPAYMENTS_API_KEY=${NOWPAYMENTS_API_KEY}
      - API_URL=http://api:8000
      - MIN_PAYMENT_USD=${MIN_PAYMENT_USD:-11}
    volumes:
      - ./data:/data
    depends_on:
      - api
    restart: always

  # Nginx (web site + reverse proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./admin:/var/www/admin:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/data:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./downloads:/var/www/downloads:ro
    depends_on:
      - api
    restart: always
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  # Certbot for SSL (optional)
  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    profiles:
      - certbot

networks:
  default:
    name: hameleonweb-network
    driver: bridge
