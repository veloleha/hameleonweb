server {
    listen 80;
    server_name hameleonweb.xyz www.hameleonweb.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hameleonweb.xyz$request_uri;
    }
}

server {
    listen 80;
    server_name _;  # Accept any hostname (fallback)

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static website
    location / {
        if (-f /data/maintenance.flag) {
            return 503;
        }

        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /download/latest.json {
        alias /var/www/downloads/latest.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*";
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Sufler operator page
    location /sufler/ {
        proxy_pass http://sufler:8001/sufler/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sufler WebSocket signaling
    location /ws/sufler/ {
        proxy_pass http://sufler:8001/ws/sufler/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Webhook for NOWPayments (bypass auth)
    location /api/payment/webhook/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Downloads directory
    location /download/ {
        alias /var/www/downloads/;
        autoindex on;
        
        # Force download for .exe files
        location ~ \.exe$ {
            add_header Content-Type application/octet-stream;
            add_header Content-Disposition 'attachment';
        }
    }

    # Admin panel — whitelist only
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        allow 134.249.64.193;
        deny all;
        root /var/www;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Health check
    location /health {
        proxy_pass http://api:8000;
        access_log off;
    }

    # Logs
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined;
}

server {
    listen 443 ssl http2;
    server_name hameleonweb.xyz www.hameleonweb.xyz;

    ssl_certificate /etc/letsencrypt/live/hameleonweb.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hameleonweb.xyz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hameleonweb.xyz/chain.pem;

