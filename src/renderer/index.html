<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div class="sidebar-header">
          <div class="title">WhatsApp Manager</div>
          <div class="row">
            <button id="btnReload" class="btn secondary">Reload</button>
            <button id="btnSettings" class="btn secondary">Settings</button>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Accounts</div>
          <div id="accounts"></div>
        </div>

        <div class="sidebar-footer">
          <button id="btnAdd" class="btn">+ Add account</button>
        </div>
      </div>

      <div id="content">
        <div id="contentPlaceholder" class="placeholder">
          Select an account to show WhatsApp Web.
        </div>

        <div id="settingsPanel" class="settings hidden">
          <div class="settings-header">
            <div class="section-title">Settings</div>
          </div>

          <div class="field">
            <label>
              <input type="checkbox" id="alwaysRecord" />
              Always record (auto)
            </label>
          </div>

          <div class="field">
            <div class="label">Recordings path</div>
            <div class="row">
              <input id="recordingsPath" class="input" type="text" placeholder="\\\\server\\share\\WA_Recordings" />
              <button id="btnBrowsePath" class="btn secondary">Browse</button>
            </div>
            <div class="row">
              <button id="btnOpenFolder" class="btn secondary">Open folder</button>
            </div>
          </div>

          <div class="field">
            <div class="label">Mic device (WASAPI)</div>
            <select id="micDeviceSelect" class="input"></select>
            <input id="micDeviceManual" class="input hidden" type="text" placeholder="default" />
          </div>

          <div class="field">
            <div class="label">Speaker device (WASAPI, loopback)</div>
            <select id="speakerDeviceSelect" class="input"></select>
            <input id="speakerDeviceManual" class="input hidden" type="text" placeholder="default" />
          </div>

          <div class="field">
            <div class="label">MP3 quality (0 best .. 9 worst)</div>
            <input id="mp3Quality" class="input" type="number" min="0" max="9" step="1" />
          </div>

          <div class="field">
            <div class="row">
              <button id="btnListDevices" class="btn secondary">List devices</button>
            </div>
            <textarea id="devicesList" class="textarea" rows="6" readonly></textarea>
          </div>

          <div class="field">
            <div class="label">Test recording</div>
            <div class="row">
              <button id="btnTestRecording" class="btn secondary">Test (10 sec)</button>
            </div>
            <div id="testRecordingStatus" class="hint"></div>
            <audio id="testRecordingPlayback" class="hidden" controls></audio>
          </div>

          <div class="field">
            <div class="label">Versions</div>
            <div id="versions" class="mono"></div>
            <div class="hint">
              Chromium updates come with Electron app updates.
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
