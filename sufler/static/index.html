<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMELEONWEB — Голосовой суфлёр</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0d10;
      color: #e4e6eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .room { color: #8a8f98; font-size: 14px; margin-bottom: 32px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #1e2229;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.connected { background: #22c55e; }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #334155; cursor: not-allowed; }
    .btn-hangup { background: #ef4444; }
    .btn-hangup:hover { background: #dc2626; }
    .volume {
      margin-top: 24px;
      width: 100%;
    }
    .volume label { display: block; font-size: 13px; color: #8a8f98; margin-bottom: 8px; }
    .volume input { width: 100%; }
    .hint {
      margin-top: 24px;
      font-size: 13px;
      color: #8a8f98;
      line-height: 1.5;
    }
    .audio-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Голосовой суфлёр</h1>
    <div class="room" id="roomId">Загрузка...</div>

    <div class="status" id="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Ожидание подключения</span>
    </div>

    <div class="audio-row">
      <button class="btn" id="connectBtn" disabled>Подключиться</button>
      <button class="btn btn-hangup" id="hangupBtn" disabled>Завершить</button>
    </div>

    <div class="volume">
      <label for="volumeSlider">Громкость голоса спикера</label>
      <input type="range" id="volumeSlider" min="0" max="100" value="80">
    </div>

    <div class="hint">
      Нажмите «Подключиться», чтобы оператор услышал звук со стороны спикера и мог говорить ему подсказки.
    </div>
    <div class="hint" id="relayNote">Relay diagnostics will appear here.</div>
  </div>

  <script>
    const roomId = window.location.pathname.split('/').pop();
    document.getElementById('roomId').textContent = `Комната: ${roomId}`;

    const wsUrl = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}/ws/sufler/${roomId}`;
    const connectBtn = document.getElementById('connectBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const volumeSlider = document.getElementById('volumeSlider');

    let ws = null;
    let pc = null;
    let localStream = null;
    let remoteAudio = null;
    let relayCaptureCtx = null;
    let relayCaptureNode = null;
    let relayCaptureSource = null;
    let relayCaptureGain = null;
    let relayPlayCtx = null;
    let relayPlayNode = null;
    let relayPlayQueue = [];
    let relayPlayOffset = 0;

    function rmsOfFloat32(samples) {
      if (!samples || !samples.length) return 0;
      let sum = 0;
      for (let i = 0; i < samples.length; i++) {
        const v = samples[i] || 0;
        sum += v * v;
      }
      return Math.sqrt(sum / samples.length);
    }

    function logRelay(msg) {
      console.log('[relay]', msg);
      const note = document.getElementById('relayNote');
      if (note) note.textContent = String(msg);
    }

    function float32ToBase64(float32) {
      const pcm = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i] || 0));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      const bytes = new Uint8Array(pcm.buffer);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function base64ToFloat32(b64) {
      const binary = atob(String(b64 || ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const pcm = new Int16Array(bytes.buffer);
      const out = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) out[i] = pcm[i] / 32768;
      return out;
    }

    function startRelayCapture() {
      if (relayCaptureNode || !localStream) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      relayCaptureCtx = new AC();
      relayCaptureSource = relayCaptureCtx.createMediaStreamSource(localStream);
      relayCaptureNode = relayCaptureCtx.createScriptProcessor(1024, 1, 1);
      // Глушим выход в динамики, чтобы оператор не слышал сам себя.
      relayCaptureGain = relayCaptureCtx.createGain();
      relayCaptureGain.gain.value = 0;
      relayCaptureSource.connect(relayCaptureNode);
      relayCaptureNode.connect(relayCaptureGain);
      relayCaptureGain.connect(relayCaptureCtx.destination);
      relayCaptureNode.onaudioprocess = (ev) => {
        try {
          const input = ev.inputBuffer.getChannelData(0);
          if (!input || !input.length || !ws || ws.readyState !== WebSocket.OPEN) return;
          const copy = new Float32Array(input.length);
          copy.set(input);
          ws.send(JSON.stringify({ type: 'audio', payload: float32ToBase64(copy), sampleRate: relayCaptureCtx.sampleRate || 48000, channels: 1, role: 'operator' }));
        } catch (e) {
          console.error('operator relay capture error', e);
        }
      };
    }

    function queuedSampleCount() {
      let total = 0;
      for (let i = 0; i < relayPlayQueue.length; i++) total += relayPlayQueue[i].length;
      return total - relayPlayOffset;
    }

    function queueRelayPlayback(base64, meta = {}) {
      const samples = base64ToFloat32(base64);
      if (!samples || !samples.length) return;
      const rms = rmsOfFloat32(samples);
      logRelay(`recv chunk=${samples.length} rms=${rms.toFixed(4)} sampleRate=${meta.sampleRate || 'n/a'} channels=${meta.channels || 'n/a'}`);
      relayPlayQueue.push(samples);
      // Не даём очереди расти больше ~120 мс, иначе задержка накапливается.
      const sr = (relayPlayCtx && relayPlayCtx.sampleRate) || meta.sampleRate || 48000;
      const maxQueued = Math.floor(sr * 0.12);
      while (queuedSampleCount() > maxQueued && relayPlayQueue.length > 1) {
        relayPlayQueue.shift();
        relayPlayOffset = 0;
      }
      if (!relayPlayNode) {
        const AC = window.AudioContext || window.webkitAudioContext;
        relayPlayCtx = new AC();
        relayPlayNode = relayPlayCtx.createScriptProcessor(1024, 0, 1);
        relayPlayNode.onaudioprocess = (ev) => {
          const out = ev.outputBuffer.getChannelData(0);
          let idx = 0;
          while (idx < out.length) {
            while (relayPlayQueue.length && relayPlayOffset >= relayPlayQueue[0].length) {
              relayPlayQueue.shift();
              relayPlayOffset = 0;
            }
            if (!relayPlayQueue.length) {
              out[idx++] = 0;
              continue;
            }
            const chunk = relayPlayQueue[0];
            const take = Math.min(chunk.length - relayPlayOffset, out.length - idx);
            out.set(chunk.subarray(relayPlayOffset, relayPlayOffset + take), idx);
            idx += take;
            relayPlayOffset += take;
          }
        };
        relayPlayNode.connect(relayPlayCtx.destination);
        logRelay('playback started');
      }
    }

    function setStatus(text, connected) {
      statusText.textContent = text;
      statusDot.classList.toggle('connected', connected);
    }

    async function start() {
      connectBtn.disabled = true;
      setStatus('Запрос микрофона...', false);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
      } catch (err) {
        console.error(err);
        setStatus('Нет доступа к микрофону', false);
        connectBtn.disabled = false;
        return;
      }

      setStatus('Подключение к серверу...', false);
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', role: 'operator' }));
      };

      ws.onclose = () => {
        setStatus('Соединение закрыто', false);
        hangup();
      };

      ws.onerror = (err) => {
        console.error('WS error', err);
        setStatus('Ошибка WebSocket', false);
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        console.log('operator msg', msg);

        if (msg.type === 'peer-joined') {
          setStatus('Спикер подключён, ожидание аудио...', true);
        } else if (msg.type === 'peer-left') {
          setStatus('Спикер отключился', false);
        } else if (msg.type === 'audio') {
          queueRelayPlayback(msg.payload, msg);
        } else if (msg.type === 'offer') {
          setStatus('Получен offer, создаём answer...', true);
          await handleOffer(msg.payload);
        } else if (msg.type === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.payload));
        } else if (msg.type === 'ice-candidate') {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(msg.payload));
          } catch (e) {
            console.error('addIceCandidate error', e);
          }
        }
      };

      startRelayCapture();
      hangupBtn.disabled = false;
    }

    async function createPeerConnection() {
      if (pc) return;

      pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });

      localStream.getAudioTracks().forEach(track => pc.addTrack(track, localStream));

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ type: 'ice-candidate', payload: event.candidate.toJSON() }));
        }
      };

      pc.ontrack = (event) => {
        if (!remoteAudio) {
          remoteAudio = document.createElement('audio');
          remoteAudio.autoplay = true;
          remoteAudio.playsInline = true;
          remoteAudio.controls = false;
          remoteAudio.volume = volumeSlider.value / 100;
          document.body.appendChild(remoteAudio);
        }
        remoteAudio.srcObject = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
        try {
          const playPromise = remoteAudio.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch((e) => console.error('operator remote audio play failed', e));
          }
        } catch (e) {
          console.error('operator remote audio play exception', e);
        }
      };

      pc.onconnectionstatechange = () => {
        console.log('PC state', pc.connectionState);
        if (pc.connectionState === 'connected') {
          setStatus('WebRTC соединение активно', true);
        } else if (pc.connectionState === 'failed') {
          setStatus('WebRTC соединение прервано', false);
        }
      };
    }

    async function createOffer() {
      await createPeerConnection();
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', payload: offer }));
    }

    async function handleOffer(offer) {
      await createPeerConnection();
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'answer', payload: answer }));
    }

    function hangup() {
      if (pc) {
        pc.close();
        pc = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (remoteAudio) {
        remoteAudio.remove();
        remoteAudio = null;
      }
      if (relayCaptureNode) {
        try { relayCaptureNode.disconnect(); } catch (e) {}
        relayCaptureNode = null;
      }
      if (relayCaptureSource) {
        try { relayCaptureSource.disconnect(); } catch (e) {}
        relayCaptureSource = null;
      }
      if (relayCaptureGain) {
        try { relayCaptureGain.disconnect(); } catch (e) {}
        relayCaptureGain = null;
      }
      if (relayCaptureCtx) {
        try { relayCaptureCtx.close(); } catch (e) {}
        relayCaptureCtx = null;
      }
      if (relayPlayNode) {
        try { relayPlayNode.disconnect(); } catch (e) {}
        relayPlayNode = null;
      }
      if (relayPlayCtx) {
        try { relayPlayCtx.close(); } catch (e) {}
        relayPlayCtx = null;
      }
      relayPlayQueue = [];
      relayPlayOffset = 0;
      connectBtn.disabled = false;
      hangupBtn.disabled = true;
      setStatus('Ожидание подключения', false);
    }

    connectBtn.addEventListener('click', start);
    hangupBtn.addEventListener('click', hangup);
    volumeSlider.addEventListener('input', () => {
      if (remoteAudio) remoteAudio.volume = volumeSlider.value / 100;
    });

    // Allow connecting when loaded
    setStatus('Готов к подключению', false);
    connectBtn.disabled = false;
  </script>
</body>
</html>
